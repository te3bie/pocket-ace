project_id = "pocket-ace"
[auth]
site_url = "http://localhost:8081"
additional_redirect_urls = ["pocketace://", "http://localhost:8081/"]
minimum_password_length = 12
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
[functions.pocketpal]
verify_jwt = false
[functions.account]
verify_jwt = false
[functions.bank]
verify_jwt = false
# Every function validates the bearer token with Auth itself. Bank webhooks use signed JWT verification.
